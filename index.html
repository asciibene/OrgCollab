<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrgCollab — Minimal Collaborative Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="./setup.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="h-screen w-screen flex flex-col bg-bg text-textMain selection:bg-accent/30">

  <!-- ==================== TOKEN GATE MODAL ==================== -->
  <div id="token-gate" class="fixed inset-0 z-50 flex items-center justify-center bg-bg/95 backdrop-blur-sm p-4">
    <div class="w-full max-w-md bg-surface border border-border rounded-xl p-6 shadow-2xl">
      <div class="flex items-center gap-2.5 mb-2">
        <span class="text-accent font-mono text-xl font-semibold">*</span>
        <h1 class="text-lg font-semibold tracking-tight text-textMain">OrgCollab</h1>
      </div>
      <p class="text-sm text-textMuted mb-6">
        Enter any shared notebook token to collaborate in real time. No account required.
        <span class="block mt-2 text-xs text-todo/80">Anyone with the token can read and edit this notebook. Do not use it for private notes.</span>
      </p>

      <form id="token-form" class="space-y-4">
        <div>
          <label for="token-input" class="block text-xs font-medium text-textMuted uppercase tracking-wider mb-1.5">
            Notebook Token <span class="text-todo">*</span>
          </label>
          <input
            id="token-input"
            type="text"
            required
            autocomplete="off"
            placeholder="e.g. project-alpha, study-notes"
            class="w-full bg-bg border border-border rounded-lg px-3.5 py-2.5 text-sm font-mono text-textMain placeholder-textMuted/50 focus:outline-none focus:border-accent transition-colors"
          />
        </div>

        <div>
          <label for="nickname-input" class="block text-xs font-medium text-textMuted uppercase tracking-wider mb-1.5">
            Display Name <span class="text-textMuted/60 font-normal">(optional)</span>
          </label>
          <input
            id="nickname-input"
            type="text"
            autocomplete="off"
            placeholder="Leave empty for random (e.g. anon-42)"
            class="w-full bg-bg border border-border rounded-lg px-3.5 py-2.5 text-sm font-mono text-textMain placeholder-textMuted/50 focus:outline-none focus:border-accent transition-colors"
          />
        </div>

        <button
          type="button"
          id="join-btn"
          class="w-full bg-accent hover:bg-accent/90 text-bg font-medium text-sm py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2"
        >
          <span>Open Notebook</span>
          <span class="font-mono text-xs opacity-80">→</span>
        </button>
      </form>

      <div id="gate-error" class="hidden mt-3 text-xs text-todo font-mono"></div>
    </div>
  </div>



  <!-- ==================== MAIN APP SHELL ==================== -->
  <div id="app-shell" class="hidden flex-1 flex h-full overflow-hidden">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>

    <!-- ==================== SIDEBAR ==================== -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-surface border-r border-border flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-out">
      <!-- Notebook Header -->
      <div class="h-12 px-4 border-b border-border flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-accent font-mono font-bold">*</span>
          <span id="notebook-badge" class="font-mono text-sm font-medium truncate text-textMain" title="Current Notebook Token"></span>
        </div>
        <button id="switch-token-btn" title="Switch Notebook" class="text-xs text-textMuted hover:text-textMain px-2 py-1 rounded hover:bg-surfaceHover transition-colors font-mono">
          switch
        </button>
      </div>

      <!-- Notes List Header -->
      <div class="px-4 py-2.5 flex items-center justify-between">
        <span class="text-xs font-medium uppercase tracking-wider text-textMuted">Notes</span>
        <button id="new-note-btn" title="New Note" class="w-6 h-6 flex items-center justify-center rounded hover:bg-surfaceHover text-textMuted hover:text-accent transition-colors font-mono text-base">
          +
        </button>
      </div>

      <!-- Notes List -->
      <div id="notes-list" class="flex-1 overflow-y-auto px-2 space-y-0.5">
        <!-- Populated dynamically -->
      </div>

      <!-- Online Users Section -->
      <div class="border-t border-border p-3 bg-bg/40 shrink-0">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium uppercase tracking-wider text-textMuted flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-done pulse-dot"></span>
            Online (<span id="online-count">0</span>)
          </span>
          <span id="my-nickname-badge" class="text-xs font-mono text-textMuted truncate max-w-[110px]"></span>
        </div>
        <div id="online-users-list" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto">
          <!-- Populated dynamically -->
        </div>
      </div>
    </aside>

    <!-- ==================== MAIN EDITOR AREA ==================== -->
    <main class="flex-1 flex flex-col min-w-0 bg-bg">
      <!-- Top Bar -->
      <header class="h-12 px-3 sm:px-5 border-b border-border flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
          <button id="mobile-menu-btn" class="md:hidden p-1.5 rounded hover:bg-surfaceHover text-textMuted hover:text-textMain">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <input
            id="note-title-input"
            type="text"
            placeholder="Untitled Note"
            class="bg-transparent text-sm sm:text-base font-medium text-textMain placeholder-textMuted/50 focus:outline-none truncate w-full font-mono"
          />
        </div>

        <!-- Active Note Presence & Mode Toggles -->
        <div class="flex items-center gap-3 shrink-0">
          <!-- Who is viewing/editing this note -->
          <div id="note-presence" class="hidden sm:flex items-center gap-1.5 text-xs font-mono text-textMuted">
            <!-- Populated dynamically -->
          </div>

          <!-- Sync Status -->
          <span id="sync-status" class="text-xs font-mono text-textMuted/70 hidden sm:inline">synced</span>

          <!-- View Mode Toggle: Edit | Split | Preview -->
          <div class="flex items-center bg-surface border border-border rounded-lg p-0.5 text-xs font-mono">
            <button data-mode="edit" class="mode-btn px-2.5 py-1 rounded-md transition-colors text-textMain bg-surfaceHover">Edit</button>
            <button data-mode="split" class="mode-btn hidden sm:block px-2.5 py-1 rounded-md transition-colors text-textMuted hover:text-textMain">Split</button>
            <button data-mode="preview" class="mode-btn px-2.5 py-1 rounded-md transition-colors text-textMuted hover:text-textMain">Preview</button>
          </div>
        </div>
      </header>

      <!-- Mobile Note Presence Bar -->
      <div id="mobile-note-presence" class="sm:hidden px-4 py-1.5 border-b border-border bg-surface/50 text-xs font-mono text-textMuted hidden">
      </div>

      <!-- Empty State (when no note is selected) -->
      <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="text-3xl font-mono text-border mb-3">*</div>
        <p class="text-sm text-textMuted mb-4">No note selected or notebook is empty.</p>
        <button id="empty-new-note-btn" class="px-4 py-2 bg-surface hover:bg-surfaceHover border border-border rounded-lg text-sm font-mono text-accent transition-colors">
          + Create First Note
        </button>
      </div>

      <!-- Editor & Preview Workspace -->
      <div id="workspace" class="flex-1 flex overflow-hidden">
        <!-- Raw Org-mode Textarea -->
        <div id="editor-pane" class="flex-1 flex flex-col min-w-0 h-full">
          <textarea
            id="note-editor"
            spellcheck="false"
            class="flex-1 w-full h-full bg-bg text-textMain p-4 sm:p-6 text-sm focus:outline-none overflow-y-auto"
          ></textarea>
        </div>

        <!-- Divider (for Split mode) -->
        <div id="split-divider" class="hidden w-px bg-border shrink-0"></div>

        <!-- Live Org-mode Preview -->
        <div id="preview-pane" class="hidden flex-1 overflow-y-auto p-4 sm:p-6 bg-bg/50">
          <div id="org-preview-content" class="org-preview text-sm max-w-3xl"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- ==================== CUSTOM TOAST / MESSAGE ==================== -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden bg-surface border border-border text-textMain text-xs font-mono px-3.5 py-2 rounded-lg shadow-lg"></div>

  <!-- ==================== FIREBASE & APP LOGIC ==================== -->
  <script type="module" src="./app.js"></script>
</body>
</html>
